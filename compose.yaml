services:
  f1-api:
    build:
      dockerfile: ./dockerfile.f1-api
    # volumes:
    #   - "./f1_api:/app/f1_api"
    #   - "./db:/app/db"
    #   - "./docker/prestart.sh:/app/prestart.sh"
    ports:
      - "80:80"
    environment:
      IS_DEV: true
      RELOAD: true
      DATABASE_URL: postgresql://main:main12345@db/main
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
    depends_on:
      - db
      - redis

  redis:
    image: redis
    ports:
      - "6379:6379"

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: main12345
      POSTGRES_USER: main
      POSTGRES_DB: main
    ports:
      - "5432:5432"
