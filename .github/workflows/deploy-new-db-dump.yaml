name: Deploy Database Dump

on:
  workflow_dispatch:
    inputs:
      dump_url:
        description: "Database dump URL from f1db releases"
        required: true
        default: "https://github.com/f1db/f1db/releases/latest/download/f1db-sql-postgresql.sql.gz"

jobs:
  deploy-db:
    name: Deploy Database to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: SSH & deploy database to droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd ~/f1api-deploy

            # Load environment variables
            set -a
            source .env
            set +a

            echo "📥 Downloading database dump..."
            curl -L -o f1-db-dump-new.sql.gz "${{ github.event.inputs.dump_url }}"

            echo "📦 Extracting dump..."
            gunzip -f f1-db-dump-new.sql.gz

            echo "🗄️ Starting new database (f1-db-new)..."
            docker run -d \
              --name f1-db-new \
              --network f1api-deploy_internal \
              -e POSTGRES_USER=${POSTGRES_USER} \
              -e POSTGRES_PASSWORD=${POSTGRES_PASSWORD} \
              -e POSTGRES_DB=${POSTGRES_DB} \
              -v $(pwd)/f1-db-dump-new.sql:/docker-entrypoint-initdb.d/f1-db-dump.sql:ro \
              postgres:16

            echo "⏳ Waiting for new database to initialize..."
            TIMEOUT=600
            ELAPSED=0
            until docker exec f1-db-new pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "❌ New database failed to become ready in time. Rolling back..."
                docker stop f1-db-new
                docker rm f1-db-new
                rm -f f1-db-dump-new.sql
                exit 1
              fi
              echo "Waiting... ($ELAPSED/$TIMEOUT seconds)"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            sleep 60  # Extra wait for import

            echo "🔍 Validating database schema..."
            TABLE_COUNT=$(docker exec f1-db-new psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -t -c \
              "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';")
            if [ "$TABLE_COUNT" -lt 5 ]; then
              echo "❌ Validation failed: $TABLE_COUNT tables found. Rolling back..."
              docker stop f1-db-new
              docker rm f1-db-new
              rm -f f1-db-dump-new.sql
              exit 1
            fi
            echo "✅ Database schema validated ($TABLE_COUNT tables)"

            echo "🔄 Swapping databases..."
            docker compose stop f1-api f1-db || true
            docker rename f1-db f1-db-old || true
            docker rename f1-db-new f1-db
            docker network disconnect f1api-deploy_internal f1-db || true
            docker network connect --alias f1-db f1api-deploy_internal f1-db
            docker compose start f1-api

            echo "🗑️ Removing old database..."
            docker stop f1-db-old || true
            docker rm f1-db-old || true

            echo "🧹 Cleaning up dump file..."
            rm -f f1-db-dump-new.sql

            echo "🧹 Cleaning up old images and volumes..."
            docker image prune -f
            docker volume prune -f

            echo "✅ Database deployment complete!"
            docker compose ps
