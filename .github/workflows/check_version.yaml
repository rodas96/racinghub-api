name: "Check API Version Update"

on:
  pull_request:
    branches:
      - main

jobs:
  check_version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check if _version.py changed
        id: version_file_check
        run: |
          echo "Checking changed files in PR..."

          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})

          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "^f1_api/_version.py$"; then
            echo "Version file modified ✅"
          else
            echo "❌ f1_api/_version.py must be updated in every PR that affects API versioning"
            exit 1
          fi

      - name: Output version
        run: |
          export PYTHONPATH=$PWD

          VERSION=$(python -c "from f1_api._version import __version__; print(__version__)")

          echo "Current version in PR: $VERSION"